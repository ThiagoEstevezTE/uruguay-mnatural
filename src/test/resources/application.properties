# Los tests usan H2 en memoria: no necesitan Postgres ni Supabase
# LOCK_TIMEOUT: con un bloqueo (FOR UPDATE) el otro pedido espera hasta 10 s. Sin esto H2 corta a los 2 segundos
# (Postgres espera sin limite), y las pruebas de BookingConcurrencyTest fallarian en una maquina lenta
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

spring.web.locale=es_UY
spring.web.locale-resolver=fixed

payment.gateway.url=http://localhost:0/fake-gateway
weather.api.url=http://localhost:0
app.demo-password=demo1234
