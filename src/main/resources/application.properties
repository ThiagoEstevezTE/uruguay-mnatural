spring.application.name=proyectotic2026

# Los datos de conexion se leen del archivo .env (no se sube a Git).
# Copiar .env.example como .env y completar. Sirve igual para Postgres local o Supabase.
spring.config.import=optional:file:.env[.properties]

# Base de datos PostgreSQL. Sin .env usa la base de docker-compose.yml (localhost, postgres/postgres).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/uymnatural}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Conexiones: Supabase corta las que quedan quietas un rato. Con esto la app las
# renueva antes y, si una se cae, se entera en segundos en vez de colgarse 30.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000

# update: Hibernate crea las tablas que falten y NO borra lo que ya hay (seguro para Supabase).
# Para que la demo local arranque siempre de cero, poner DB_DDL_AUTO=create en el .env.
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}

# Contraseña de las cuentas de ejemplo que carga DataLoader (solo la primera vez, con la base vacia)
app.demo-password=${DEMO_PASSWORD:demo1234}
spring.jpa.show-sql=false

# Trae juntas (con un solo IN) las fechas, tipos y emprendimientos de varias actividades,
# en vez de una consulta por actividad. Con Supabase cada consulta cuesta un viaje a San Pablo.
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Ejecutar data.sql DESPUES de que Hibernate cree las tablas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# Fechas y numeros en español de Uruguay en todas las paginas
spring.web.locale=es_UY
spring.web.locale-resolver=fixed

# Servicio de pagos externo. Para la demo apunta al simulador que trae la propia app.
payment.gateway.url=${PAYMENT_GATEWAY_URL:http://localhost:8080/fake-gateway}
# Proveedor de pagos
payment.provider=${PAYMENT_PROVIDER:mercadopago}
mercadopago.access-token=${MP_ACCESS_TOKEN:}
mercadopago.public-key=${MP_PUBLIC_KEY:}

# Documentacion de la API (Swagger UI)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.packages-to-scan=uy.edu.um.proyectotic2026.controllers
springdoc.paths-to-match=/api/**

# API publica de clima (Open-Meteo, gratis y sin clave)
weather.api.url=${WEATHER_API_URL:https://api.open-meteo.com}
