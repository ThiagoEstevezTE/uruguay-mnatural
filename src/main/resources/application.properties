spring.application.name=proyectotic2026

# Base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:uymnatural
spring.datasource.username=sa
spring.datasource.password=

# Consola web para ver las tablas
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate crea las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true


# Ejecutar data.sql DESPUES de que Hibernate cree las tablas
spring.jpa.defer-datasource-initialization=true