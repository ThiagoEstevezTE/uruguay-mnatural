spring.application.name=proyectotic2026

# Los datos de conexion se leen del archivo .env (no se sube a Git).
# Copiar .env.example como .env y completar. Sirve igual para Postgres local o Supabase.
spring.config.import=optional:file:.env[.properties]

# Base de datos PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/uymnatural}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate crea las tablas a partir de las entidades cada vez que arranca la app,
# y despues se cargan los datos de ejemplo. Asi la demo siempre arranca igual.
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false

# Ejecutar data.sql DESPUES de que Hibernate cree las tablas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# Fechas y numeros en español de Uruguay en todas las paginas
spring.web.locale=es_UY
spring.web.locale-resolver=fixed

# Servicio de pagos externo. Para la demo apunta al simulador que trae la propia app.
payment.gateway.url=${PAYMENT_GATEWAY_URL:http://localhost:8080/fake-gateway}

# Documentacion de la API (Swagger UI)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.packages-to-scan=uy.edu.um.proyectotic2026.controllers
springdoc.paths-to-match=/api/**

# API publica de clima (Open-Meteo, gratis y sin clave)
weather.api.url=${WEATHER_API_URL:https://api.open-meteo.com}
