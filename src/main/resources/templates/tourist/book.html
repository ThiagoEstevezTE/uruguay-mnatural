<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Reservar')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">
    <a th:href="@{/activities/{id}(id=${activity.id})}" class="small"><i class="bi bi-arrow-left"></i> Volver a la actividad</a>
    <h1 class="h3 section-title mt-2 mb-4">Reservar</h1>

    <div th:replace="~{fragments/layout :: messages}"></div>

    <div class="row g-4">
        <div class="col-lg-7">
            <form class="card card-um p-4" th:action="@{/tourist/book/{id}(id=${instance.id})}" method="post">
                <label class="form-label fw-semibold" for="participants">¿Cuántas personas van?</label>
                <input type="number" id="participants" name="participants" class="form-control mb-1"
                       min="1" th:max="${maxParticipants}" th:value="${participants ?: 1}" required>
                <div class="form-text mb-3" th:if="${instance.maxCapacity}">
                    Esta fecha tiene cupo de <span th:text="${instance.maxCapacity}"></span> personas.
                </div>

                <label class="form-label fw-semibold" for="observations">Observaciones para el prestador (opcional)</label>
                <textarea id="observations" name="observations" class="form-control mb-1" rows="3" maxlength="1000"
                          placeholder="Ej.: condiciones médicas, alergias, alguien que necesita ayuda..."
                          th:text="${observations}"></textarea>
                <div class="form-text mb-4">Solo las ve el prestador, para organizar la actividad.</div>

                <div class="alert alert-light border small">
                    <i class="bi bi-info-circle"></i>
                    Al continuar, tu lugar queda guardado <strong>2 horas</strong> mientras hacés el pago.
                    La reserva se confirma cuando el pago está aprobado.
                </div>

                <button type="submit" class="btn btn-accent btn-lg">Continuar al pago <i class="bi bi-arrow-right"></i></button>
            </form>
        </div>

        <div class="col-lg-5">
            <div class="card card-um">
                <div th:replace="~{fragments/cards :: cover(${activity}, '120px')}"></div>
                <div class="p-4">
                    <h2 class="h5" th:text="${activity.name}"></h2>
                    <ul class="list-unstyled info-list small mb-3">
                        <li class="mb-1"><i class="bi bi-calendar-event"></i>
                            <span class="text-capitalize" th:text="${#temporals.format(instance.startDateTime, 'EEEE dd/MM/yyyy · HH:mm')}"></span></li>
                        <li class="mb-1"><i class="bi bi-geo-alt"></i>
                            <span th:text="${activity.locality.name + ', ' + activity.locality.department.name}"></span></li>
                        <li class="mb-1"><i class="bi bi-clock"></i> <span th:text="${activity.durationText}"></span></li>
                        <li th:if="${activity.minimumAge}"><i class="bi bi-person"></i>
                            <span th:text="${'Edad mínima: ' + activity.minimumAge + ' años'}"></span></li>
                    </ul>
                    <div class="d-flex justify-content-between border-top pt-3">
                        <span>Total</span>
                        <span class="price fs-5" id="total" th:attr="data-price=${activity.price}"
                              th:text="${'$ ' + #numbers.formatDecimal(activity.price, 1, 'POINT', 0, 'COMMA')}"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script>
    // Actualiza el total cuando cambia la cantidad de personas (el total real lo calcula el servidor)
    const participants = document.getElementById('participants');
    const total = document.getElementById('total');
    function updateTotal() {
        const amount = Number(total.dataset.price) * Math.max(1, Number(participants.value) || 1);
        total.textContent = '$ ' + amount.toLocaleString('es-UY');
    }
    participants.addEventListener('input', updateTotal);
    updateTotal();
</script>
</body>
</html>
