<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Ingresar')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card card-um p-4">
                <h1 class="h3 mb-1">Ingresar</h1>
                <p class="text-muted mb-4">Turistas, prestadores y administradores entran desde acá.</p>

                <div th:replace="~{fragments/layout :: messages}"></div>
                <div th:if="${param.error}" class="alert alert-danger">
                    Email o contraseña incorrectos.
                </div>

                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label">Email</label>
                        <input type="email" id="username" name="username" class="form-control" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" id="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Ingresar</button>
                </form>

                <hr class="my-4">
                <p class="small mb-1">¿No tenés cuenta? <a th:href="@{/register/tourist}">Registrate como turista</a></p>
                <p class="small mb-0">¿Ofrecés actividades? <a th:href="@{/register/provider}">Registrá tu emprendimiento</a></p>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
