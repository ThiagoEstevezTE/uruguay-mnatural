<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Pestañas del panel del administrador. "active" es la pestaña actual. -->
<nav th:fragment="menu(active)" class="nav nav-pills mt-3">
    <a class="nav-link" th:classappend="${active == 'inbox'} ? 'active'" th:href="@{/admin}">
        <i class="bi bi-inbox"></i> Solicitudes
    </a>
    <a class="nav-link" th:classappend="${active == 'businesses'} ? 'active'" th:href="@{/admin/businesses}">
        <i class="bi bi-shop"></i> Emprendimientos
    </a>
    <a class="nav-link" th:classappend="${active == 'activity-types'} ? 'active'" th:href="@{/admin/activity-types}">
        <i class="bi bi-tags"></i> Tipos de actividad
    </a>
    <a class="nav-link" th:classappend="${active == 'equipment'} ? 'active'" th:href="@{/admin/equipment}">
        <i class="bi bi-backpack"></i> Equipamiento
    </a>
    <a class="nav-link" th:classappend="${active == 'cancellation-reasons'} ? 'active'" th:href="@{/admin/cancellation-reasons}">
        <i class="bi bi-calendar-x"></i> Motivos de cancelación
    </a>
</nav>
</body>
</html>
