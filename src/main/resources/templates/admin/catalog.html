<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${title})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<!-- ABM generico: lo usan "Tipos de actividad" y "Equipamiento". "path" dice cual es. -->
<header class="panel-header">
    <div class="container">
        <h1 class="h3 mb-1">Administración</h1>
        <nav th:replace="~{admin/menu :: menu(${path})}"></nav>
    </div>
</header>

<main class="container">
    <div th:replace="~{fragments/layout :: messages}"></div>

    <div class="row g-4">
        <div class="col-lg-4">
            <div class="card card-um p-4">
                <h2 class="h5">Agregar</h2>
                <p class="small text-muted">Estos datos los usan todos los prestadores al cargar sus actividades.</p>
                <form th:action="@{/admin/{path}(path=${path})}" method="post">
                    <input type="text" name="name" class="form-control mb-2" th:placeholder="${placeholder}" required>
                    <button type="submit" class="btn btn-primary w-100"><i class="bi bi-plus-lg"></i> Agregar</button>
                </form>
            </div>
        </div>

        <div class="col-lg-8">
            <div class="card card-um">
                <div class="p-3 border-bottom d-flex justify-content-between">
                    <h2 class="h5 mb-0" th:text="${title}"></h2>
                    <span class="text-muted small" th:text="${#lists.size(items) + ' en total'}"></span>
                </div>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item d-flex gap-2 align-items-center" th:each="item : ${items}">
                        <!-- Modificar: el nombre se edita en el mismo lugar -->
                        <form class="d-flex gap-2 flex-grow-1" method="post"
                              th:action="@{/admin/{path}/{id}(path=${path}, id=${item.id})}">
                            <input type="text" name="name" class="form-control form-control-sm" th:value="${item.name}" required>
                            <button type="submit" class="btn btn-sm btn-outline-primary" title="Guardar" aria-label="Guardar">
                                <i class="bi bi-check-lg"></i>
                            </button>
                        </form>
                        <form method="post" th:action="@{/admin/{path}/{id}/delete(path=${path}, id=${item.id})}"
                              onsubmit="return confirm('¿Eliminar este elemento?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger" title="Eliminar" aria-label="Eliminar">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
