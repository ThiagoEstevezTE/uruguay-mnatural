<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Registrar emprendimiento')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-9">
            <div class="card card-um p-4 p-md-5">
                <h1 class="h3 mb-1">Registrá tu emprendimiento</h1>
                <p class="text-muted mb-4">
                    Completá tus datos y los de tu emprendimiento. Uruguay Mnatural revisa cada solicitud y,
                    cuando esté aprobada, vas a poder publicar tus actividades.
                </p>

                <div th:replace="~{fragments/layout :: messages}"></div>

                <form th:action="@{/register/provider}" th:object="${form}" method="post">

                    <h2 class="h6 text-uppercase text-muted mt-2 mb-3">Tus datos</h2>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="type" class="form-label">¿Sos empresa o persona particular?</label>
                            <select th:field="*{type}" class="form-select" required>
                                <option value="">Elegí una opción</option>
                                <option value="INDIVIDUAL">Persona particular</option>
                                <option value="COMPANY">Empresa</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="name" class="form-label">Nombre o razón social</label>
                            <input type="text" th:field="*{name}" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label for="document" class="form-label">Documento o RUT</label>
                            <input type="text" th:field="*{document}" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label for="phone" class="form-label">Teléfono</label>
                            <input type="tel" th:field="*{phone}" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label for="email" class="form-label">Email (para ingresar)</label>
                            <input type="email" th:field="*{email}" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label for="password" class="form-label">Contraseña</label>
                            <input type="password" th:field="*{password}" class="form-control" minlength="8" required>
                            <div class="form-text">Al menos 8 caracteres.</div>
                        </div>
                    </div>

                    <h2 class="h6 text-uppercase text-muted mt-4 mb-3">Tu emprendimiento</h2>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="businessName" class="form-label">Nombre del emprendimiento</label>
                            <input type="text" th:field="*{businessName}" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label for="localityId" class="form-label">Localidad</label>
                            <!-- Las localidades agrupadas por departamento -->
                            <select th:field="*{localityId}" class="form-select" required>
                                <option value="">Elegí la localidad</option>
                                <optgroup th:each="entry : ${localitiesByDepartment}" th:label="${entry.key}">
                                    <option th:each="locality : ${entry.value}" th:value="${locality.id}"
                                            th:text="${locality.name}"></option>
                                </optgroup>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="businessAddress" class="form-label">Dirección</label>
                            <input type="text" th:field="*{businessAddress}" class="form-control" required>
                        </div>
                        <div class="col-md-3">
                            <label for="businessPhone" class="form-label">Teléfono</label>
                            <input type="tel" th:field="*{businessPhone}" class="form-control">
                        </div>
                        <div class="col-md-3">
                            <label for="businessEmail" class="form-label">Email de contacto</label>
                            <input type="email" th:field="*{businessEmail}" class="form-control">
                        </div>
                        <div class="col-12">
                            <label for="businessDescription" class="form-label">Descripción de los servicios</label>
                            <textarea th:field="*{businessDescription}" class="form-control" rows="4" maxlength="2000"></textarea>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 mt-4">Enviar solicitud</button>
                </form>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
