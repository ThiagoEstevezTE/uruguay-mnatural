<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Crear cuenta')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card card-um p-4 p-md-5">
                <h1 class="h3 mb-1">Crear cuenta de turista</h1>
                <p class="text-muted mb-4">Para reservar actividades necesitás una cuenta. Mirar la oferta es libre.</p>

                <div th:replace="~{fragments/layout :: messages}"></div>

                <form th:action="@{/register/tourist}" th:object="${form}" method="post">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="firstName" class="form-label">Nombre</label>
                            <input type="text" th:field="*{firstName}" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label for="lastName" class="form-label">Apellido</label>
                            <input type="text" th:field="*{lastName}" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label for="document" class="form-label">Documento de identidad</label>
                            <input type="text" th:field="*{document}" class="form-control" placeholder="Sin puntos ni guion" required>
                        </div>
                        <div class="col-md-6">
                            <label for="birthDate" class="form-label">Fecha de nacimiento</label>
                            <input type="date" th:field="*{birthDate}" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" th:field="*{email}" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label for="password" class="form-label">Contraseña</label>
                            <input type="password" th:field="*{password}" class="form-control" minlength="8" required>
                            <div class="form-text">Al menos 8 caracteres.</div>
                        </div>
                        <div class="col-md-6">
                            <label for="confirmPassword" class="form-label">Repetí la contraseña</label>
                            <input type="password" th:field="*{confirmPassword}" class="form-control" minlength="8" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mt-4">Crear cuenta</button>
                </form>
                <p class="small mt-3 mb-0">¿Ya tenés cuenta? <a th:href="@{/login}">Ingresá</a></p>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
