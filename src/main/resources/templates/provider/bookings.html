<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Reservas')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<header class="panel-header">
    <div class="container">
        <h1 class="h3 mb-0">Reservas de mis actividades</h1>
    </div>
</header>

<main class="container">
    <div th:replace="~{fragments/layout :: messages}"></div>

    <!-- Registrar asistencia: el numero de reserva es el que esta en el QR del turista -->
    <form class="card card-um p-4 mb-4" th:action="@{/provider/bookings/check-in}" method="post">
        <h2 class="h5"><i class="bi bi-qr-code-scan"></i> Registrar asistencia</h2>
        <p class="small text-muted">Escribí el número de reserva del turista (está debajo de su QR).</p>
        <div class="input-group" style="max-width: 420px">
            <input type="text" name="code" class="form-control font-monospace text-uppercase" placeholder="UM-XXXXXX" required>
            <button type="submit" class="btn btn-primary">Registrar</button>
        </div>
    </form>

    <div th:if="${bookings.isEmpty()}" class="card card-um p-4 text-center text-muted">Todavía no hay reservas.</div>

    <div class="table-responsive table-um card-um" th:unless="${bookings.isEmpty()}">
        <table class="table align-middle mb-0">
            <thead>
            <tr>
                <th>Fecha</th>
                <th>Actividad</th>
                <th>Turista</th>
                <th>Personas</th>
                <th>Observaciones</th>
                <th>Reserva</th>
                <th>Estado</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="booking : ${bookings}">
                <td class="text-nowrap text-capitalize" th:text="${#temporals.format(booking.instance.startDateTime, 'EEE dd/MM HH:mm')}"></td>
                <td th:text="${booking.activity.name}"></td>
                <td>
                    <span th:text="${booking.tourist.fullName}"></span>
                    <div class="small text-muted" th:text="${booking.tourist.email}"></div>
                </td>
                <td>
                    <span class="fw-semibold" th:text="${booking.participants}"></span>
                    <ul class="list-unstyled small text-muted mb-0" th:unless="${booking.people.isEmpty()}">
                        <li th:each="person : ${booking.people}" class="text-nowrap"
                            th:text="${person.fullName + ' (' + person.age + ') · ' + person.document}"></li>
                    </ul>
                </td>
                <td class="small" th:text="${booking.observations ?: '-'}"></td>
                <td class="font-monospace small" th:text="${booking.code}"></td>
                <td>
                    <span th:replace="~{fragments/layout :: bookingStatus(${booking.status})}"></span>
                    <div class="small text-muted text-nowrap" th:if="${booking.refund}"
                         th:text="${(booking.refund.status.name() == 'REFUNDED' ? 'Devuelto ' : 'Devolución en trámite ')
                                    + '$ ' + #numbers.formatDecimal(booking.refund.amount, 1, 'POINT', 0, 'COMMA')
                                    + ' (' + booking.refund.percentage + ' %)'}"></div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
