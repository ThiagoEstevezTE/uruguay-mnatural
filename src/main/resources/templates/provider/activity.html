<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${activity.name})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<header class="panel-header">
    <div class="container">
        <nav class="crumbs" aria-label="Estás en"><a th:href="@{/}" aria-label="Inicio" title="Inicio"><i class="bi bi-house-door-fill"></i></a> <i class="bi bi-chevron-right" aria-hidden="true"></i> <a th:href="@{/provider}">Mi emprendimiento</a> <i class="bi bi-chevron-right" aria-hidden="true"></i> <span th:text="${activity.name}"></span></nav>
        <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mt-2">
            <div>
                <h1 class="h3 mb-1" th:text="${activity.name}"></h1>
                <p class="text-muted mb-0">
                    <i class="bi bi-geo-alt"></i> <span th:text="${activity.locality.name + ', ' + activity.locality.department.name}"></span>
                    · <i class="bi bi-clock"></i> <span th:text="${activity.durationText}"></span>
                    · <span th:text="${'$ ' + #numbers.formatDecimal(activity.price, 1, 'POINT', 0, 'COMMA')}"></span> por persona
                </p>
            </div>
            <div class="d-flex gap-2">
                <a class="btn btn-outline-primary" th:href="@{/activities/{id}(id=${activity.id})}" target="_blank">
                    <i class="bi bi-eye"></i> Ver en el portal
                </a>
                <a class="btn btn-primary" th:href="@{/provider/activities/{id}/edit(id=${activity.id})}">
                    <i class="bi bi-pencil"></i> Editar
                </a>
            </div>
        </div>
    </div>
</header>

<main class="container">
    <div th:replace="~{fragments/layout :: messages}"></div>

    <div class="row g-4">
        <div class="col-lg-4">
            <div class="card card-um p-4">
                <h2 class="h5">Agregar fecha y horario</h2>
                <form th:action="@{/provider/activities/{id}/instances(id=${activity.id})}" method="post">
                    <label class="form-label" for="start">Inicio</label>
                    <input type="datetime-local" id="start" name="start" class="form-control mb-3" required>
                    <label class="form-label" for="maxCapacity">Cupo máximo (opcional)</label>
                    <input type="number" id="maxCapacity" name="maxCapacity" class="form-control" min="1">
                    <div class="form-text mb-3">Vacío = sin cupo.</div>
                    <button type="submit" class="btn btn-primary w-100"><i class="bi bi-calendar-plus"></i> Agregar</button>
                </form>
            </div>
        </div>

        <div class="col-lg-8">
            <div class="card card-um">
                <div class="p-3 border-bottom">
                    <h2 class="h5 mb-0">Fechas programadas</h2>
                </div>
                <div th:if="${activity.instances.isEmpty()}" class="p-4 text-center text-muted">
                    Todavía no hay fechas. Agregá la primera para que los turistas puedan reservar.
                </div>
                <ul class="list-group list-group-flush" th:unless="${activity.instances.isEmpty()}">
                    <li class="list-group-item d-flex justify-content-between align-items-center gap-2"
                        th:each="instance : ${activity.instances}">
                        <div>
                            <i class="bi bi-calendar-event"></i>
                            <span class="fw-semibold" th:text="${#temporals.format(instance.startDateTime, 'EEEE dd/MM/yyyy · HH:mm')}"></span>
                            <span class="text-muted small" th:text="${instance.maxCapacity} ? ${' · cupo ' + instance.maxCapacity} : ' · sin cupo'"></span>
                        </div>
                        <span th:if="${instance.status.name() == 'CANCELLED'}" class="badge text-bg-secondary">Cancelada</span>
                        <form th:if="${instance.status.name() == 'SCHEDULED' and instance.future}"
                              method="post" th:action="@{/provider/instances/{id}/cancel(id=${instance.id})}"
                              onsubmit="return confirm('Se van a cancelar también las reservas de esta fecha. ¿Seguir?');">
                            <input type="hidden" name="activityId" th:value="${activity.id}">
                            <button type="submit" class="btn btn-sm btn-outline-danger text-nowrap">Cancelar fecha</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
